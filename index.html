<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Спортивный челлендж | YANAO-UGRA-BATTLE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      min-height: 100vh;
      padding-top: 70px;
      padding-bottom: 20px;
    }

    .fixed-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(15, 32, 39, 0.85);
      backdrop-filter: blur(12px);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .user-info { flex: 1; }
    .user-name { font-weight: 600; color: #fff; font-size: 18px; }
    .user-details { font-size: 12px; color: rgba(255, 255, 255, 0.7); }

    .burger {
      width: 44px; height: 44px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .burger:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.02); }
    .burger span { width: 22px; height: 2px; background: white; border-radius: 2px; }

    .container { max-width: 700px; margin: 0 auto; padding: 0 20px; }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }
    .card:hover { transform: translateY(-4px); background: rgba(255, 255, 255, 0.15); }

    .stats-row, .info-row, .places-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-item, .info-card, .place-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      padding: 16px 12px;
      border-radius: 24px;
      text-align: center;
      transition: all 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
    }
    .stat-item:hover, .info-card:hover, .place-card:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .stat-value {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #a8edea 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .info-value {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffd89b 0%, #c7e9fb 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .place-value { font-size: 18px; font-weight: 700; color: #ffd966; }

    .stat-label, .info-label, .place-title {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 4px;
    }
    .place-title { font-size: 10px; margin-bottom: 6px; }

    .club-promo {
      text-align: center;
      padding: 16px;
      background: linear-gradient(135deg, rgba(252, 76, 2, 0.2), rgba(252, 76, 2, 0.05));
      border-radius: 28px;
      margin-bottom: 16px;
      border: 1px solid rgba(252, 76, 2, 0.3);
    }
    .club-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #FC4C02, #ff6a2c);
      color: white;
      padding: 10px 24px;
      border-radius: 40px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .club-link:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(252, 76, 2, 0.4); }

    .chart {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .chart h3 { color: white; margin-bottom: 16px; font-size: 14px; }
    .chart-bars {
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      height: 140px;
      margin-top: 16px;
    }
    .bar-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 12%;
    }
    .bar {
      width: 100%;
      background: linear-gradient(180deg, #ffd966, #ffb347);
      border-radius: 8px 8px 0 0;
      transition: height 0.3s ease;
      min-height: 4px;
    }
    .bar-label, .bar-value { font-size: 10px; }
    .bar-value { font-weight: 600; color: #ffd966; margin-bottom: 4px; }
    .bar-label { color: rgba(255, 255, 255, 0.6); margin-top: 8px; text-align: center; }

    .news-feed { display: flex; flex-direction: column; gap: 12px; }
    .news-item {
      background: rgba(255, 255, 255, 0.08);
      padding: 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .news-item:hover { background: rgba(255, 255, 255, 0.12); transform: translateX(4px); }
    .news-icon {
      width: 44px; height: 44px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .news-text { font-size: 13px; color: white; margin-bottom: 4px; }
    .news-time { font-size: 10px; color: rgba(255, 255, 255, 0.5); }

    .activities-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 500px;
      overflow-y: auto;
    }
    .activity-item {
      background: rgba(255, 255, 255, 0.08);
      padding: 14px;
      border-radius: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }
    .activity-item:hover { background: rgba(255, 255, 255, 0.12); transform: translateX(4px); }
    .activity-name { font-weight: 600; color: #ffd966; margin-bottom: 4px; }
    .activity-meta { font-size: 11px; color: rgba(255, 255, 255, 0.6); }

    .show-all {
      text-align: center;
      padding: 12px;
      color: #ffd966;
      font-weight: 500;
      cursor: pointer;
      margin-top: 12px;
      border-radius: 20px;
      transition: all 0.2s;
    }
    .show-all:hover { background: rgba(255, 255, 255, 0.1); }

    .filter-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-bar select {
      flex: 1;
      padding: 12px;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      cursor: pointer;
    }
    .filter-bar select option { background: #2c5364; }

    input, select {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-family: inherit;
      transition: all 0.2s;
    }
    input:focus, select:focus { outline: none; border-color: #ffd966; background: rgba(255, 255, 255, 0.15); }
    input::placeholder { color: rgba(255, 255, 255, 0.5); }

    button {
      background: linear-gradient(135deg, #ffd966, #ffb347);
      color: #2c3e50;
      border: none;
      padding: 14px;
      border-radius: 40px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 217, 102, 0.3); }

    .error { color: #ff6b6b; margin-top: 12px; font-size: 14px; text-align: center; }
    .loader {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffd966;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .menu-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
    }
    .menu {
      position: fixed;
      top: 0;
      right: 0;
      width: 280px;
      height: 100%;
      background: rgba(15, 32, 39, 0.95);
      backdrop-filter: blur(20px);
      z-index: 201;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
    }
    .menu.open { transform: translateX(0); }
    .menu-header {
      padding: 24px 20px;
      background: linear-gradient(135deg, #ffd966, #ffb347);
      color: #2c3e50;
      font-weight: 700;
    }
    .menu-item {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: all 0.2s;
      color: white;
    }
    .menu-item:hover { background: rgba(255, 255, 255, 0.1); padding-left: 28px; }

    .leaderboard-table { width: 100%; border-collapse: collapse; }
    .leaderboard-table th, .leaderboard-table td {
      padding: 12px 8px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
    }
    .leaderboard-table th { font-weight: 600; color: #ffd966; cursor: pointer; }
    .leaderboard-row { cursor: pointer; transition: background 0.2s; }
    .leaderboard-row:hover { background: rgba(255, 255, 255, 0.05); }

    .badge-gold { background: linear-gradient(135deg, #ffd700, #ffb347); }
    .badge-silver { background: linear-gradient(135deg, #c0c0c0, #a0a0a0); }
    .badge-bronze { background: linear-gradient(135deg, #cd7f32, #b87333); }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 12px; font-size: 10px; font-weight: 600; margin-left: 8px; color: #2c3e50; }

    .info-text {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 8px;
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
    }
    label { display: block; margin-bottom: 8px; font-weight: 500; color: rgba(255, 255, 255, 0.8); }
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 20px;
    }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

    @media (max-width: 600px) {
      .stats-row, .info-row, .places-row { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="app"></div>

  <script>
    const SUPABASE_URL = 'https://idkghmydocvjhuwtgojh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlka2dobXlkb2N2amh1d3Rnb2poIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyNTU3NzgsImV4cCI6MjA4OTgzMTc3OH0.omQ4zi4gILIk8nQtbYPstcORhEyEhFvKDnFs5qwFlSM';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let currentUser = null, currentPage = 'home', menuOpen = false, viewedUserId = null;
    let leaderboardSort = 'total_km', leaderboardOrder = 'desc', isAdmin = false;
    let leaderboardFilterGender = 'all', leaderboardFilterAge = 'all';
    
    const newsFeed = [
      { id: 1, user: 'Анна С.', text: 'набрала 150 баллов за неделю', time: '5 минут назад', icon: '⭐' },
      { id: 2, user: 'Дмитрий П.', text: 'получил достижение "10 км"', time: '2 часа назад', icon: '🏅' },
      { id: 3, user: 'Елена К.', text: 'повысила уровень "Выносливость" до 3', time: 'вчера', icon: '⚡' },
    ];
    
    // ============= HELPER FUNCTIONS =============
    const escapeHtml = s => s ? s.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])) : '';
    const formatDuration = m => !m ? '—' : (hrs => hrs > 0 ? `${hrs}ч ${Math.round(m % 60).toString().padStart(2,'0')}мин` : `${Math.round(m)}мин`)(Math.floor(m / 60));
    const formatDate = d => d ? new Date(d).toLocaleDateString('ru-RU') : '—';
    const getAgeGroup = a => !a ? null : a<25?'18-24':a<30?'25-29':a<35?'30-34':a<40?'35-39':a<45?'40-44':a<50?'45-49':a<55?'50-54':a<60?'55-59':a<65?'60-64':a<70?'65-69':'70+';
    const formatPace = s => s ? `${Math.floor(s/60)}:${Math.round(s%60).toString().padStart(2,'0')}` : '—';
    const showToast = (msg, d=3000) => {
      const t = document.querySelector('.toast'); if(t) t.remove();
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), d);
    };
    
    // ============= ROUTING =============
    const navigateTo = (page, userId=null) => {
      const hash = page === 'home' ? '#/' : page === 'userProfile' && userId ? `#/profile/${userId}` : `#/${page}`;
      window.location.hash = hash;
      currentPage = page;
      if(userId) viewedUserId = userId;
      render();
    };
    
    const handleRouting = () => {
      const hash = window.location.hash.slice(2);
      if(hash.startsWith('leaderboard')) currentPage = 'leaderboard';
      else if(hash.startsWith('profile/')) { viewedUserId = hash.split('/')[1]; currentPage = 'userProfile'; }
      else if(['achievements','points','abilities','activities','news','settings','sync'].includes(hash)) currentPage = hash;
      else currentPage = 'home';
      render();
    };
    
    const closeMenu = () => { menuOpen = false; document.getElementById('menu')?.classList.remove('open'); document.getElementById('menu-overlay')?.style.setProperty('display','none'); };
    const openMenu = () => { menuOpen = true; document.getElementById('menu')?.classList.add('open'); document.getElementById('menu-overlay')?.style.setProperty('display','block'); };
    
    // ============= AUTH =============
    const register = async () => {
      const [username, password, firstName, lastName, stravaUsername, gender, birthDate] = 
        ['reg-username','reg-password','reg-firstname','reg-lastname','reg-strava-username','reg-gender','reg-birthdate'].map(id => document.getElementById(id).value);
      const err = document.getElementById('register-error');
      if(!username || !password || !firstName || !lastName || !stravaUsername || !gender || !birthDate) { err.innerHTML = 'Заполните все поля'; return; }
      err.innerHTML = '<span class="loader"></span> Регистрация...';
      const { error } = await sb.auth.signUp({ email: username + '@challenge.local', password, options: { data: { username, first_name: firstName, last_name: lastName, name_full: `${firstName} ${lastName}`, strava_username: stravaUsername, gender, birth_date: birthDate } } });
      if(error) err.innerHTML = error.message.includes('already registered') ? 'Логин уже занят' : error.message;
      else { err.style.color = '#ffd966'; err.innerHTML = 'Регистрация успешна! Теперь войдите.'; showToast('Регистрация успешна!', 3000); setTimeout(() => navigateTo('home'), 1500); }
    };
    
    const login = async () => {
      const username = document.getElementById('login-username').value, password = document.getElementById('login-password').value;
      const err = document.getElementById('login-error');
      if(!username || !password) { err.innerHTML = 'Введите логин и пароль'; return; }
      err.innerHTML = '<span class="loader"></span> Вход...';
      const { data, error } = await sb.auth.signInWithPassword({ email: username + '@challenge.local', password });
      if(error) err.innerHTML = 'Неверный логин или пароль';
      else { currentUser = data.user; await checkAdminStatus(); showToast(`Добро пожаловать, ${username}!`, 3000); navigateTo('home'); }
    };
    
    const logout = async () => { await sb.auth.signOut(); currentUser = null; isAdmin = false; showToast('Вы вышли из системы', 2000); navigateTo('home'); };
    const checkAdminStatus = async () => { if(!currentUser) return false; const { data } = await sb.from('profiles').select('is_admin, role').eq('id', currentUser.id).single(); isAdmin = data?.is_admin === true || data?.role === 'admin' || currentUser.email === 'admin@challenge.local'; return isAdmin; };
    
    // ============= DATA LOADING =============
    const loadProfile = async () => { const { data } = await sb.from('profiles').select('*').eq('id', currentUser.id).single(); return data; };
    const loadStats = async () => {
      const { data } = await sb.from('activities').select('distance_km, duration_min, pace_min_per_km').eq('user_id', currentUser.id);
      if(!data) return { totalKm:0, totalTime:'—', avgPace:'—', trainingsCount:0 };
      const totalKm = data.reduce((s,a)=>s+(a.distance_km||0),0);
      const totalTime = data.reduce((s,a)=>s+(a.duration_min||0),0);
      const paces = data.filter(a=>a.pace_min_per_km).map(a=>{const m=a.pace_min_per_km.match(/(\d+):(\d+)/); return m?parseInt(m[1])*60+parseInt(m[2]):null}).filter(p=>p);
      const avgPace = paces.length ? ((s=>{const min=Math.floor(s/60), sec=Math.round(s%60); return `${min}:${sec.toString().padStart(2,'0')}`})(paces.reduce((s,p)=>s+p,0)/paces.length)) : '—';
      return { totalKm: totalKm.toFixed(2), totalTime: formatDuration(totalTime), avgPace, trainingsCount: data.length };
    };
    
    const loadPlaces = async (profile) => {
      const { data: lb } = await sb.from('leaderboard').select('*').order('total_km', { ascending: false });
      if(!lb) return { absolute:'—', gender:'—', age:'—', ageGroupName:'' };
      let absolute='—', genderPlace='—', agePlace='—', ageGroupName='';
      for(let i=0;i<lb.length;i++) if(lb[i].user_id===currentUser.id) { absolute=(i+1).toString(); break; }
      const genderLb = lb.filter(l=>l.gender===profile?.gender);
      for(let i=0;i<genderLb.length;i++) if(genderLb[i].user_id===currentUser.id) { genderPlace=(i+1).toString(); break; }
      const age = profile?.birth_date ? Math.floor((new Date()-new Date(profile.birth_date))/(365.25*24*60*60*1000)) : null;
      if(age){ const ageGroup=getAgeGroup(age); ageGroupName=ageGroup||''; const ageLb=lb.filter(l=>l.age_group===ageGroup); for(let i=0;i<ageLb.length;i++) if(ageLb[i].user_id===currentUser.id) { agePlace=(i+1).toString(); break; } }
      return { absolute, gender: genderPlace, age: agePlace, ageGroupName };
    };
    
    const loadWeeklyChart = async () => {
      const today = new Date(), startOfWeek = new Date(today);
      startOfWeek.setDate(today.getDate() - today.getDay() + (today.getDay()===0?-6:1));
      startOfWeek.setHours(0,0,0,0);
      const { data } = await sb.from('activities').select('distance_km, activity_date').eq('user_id', currentUser.id).gte('activity_date', startOfWeek.toISOString().split('T')[0]);
      if(!data) return [];
      const days = [];
      for(let i=0;i<7;i++){ const d=new Date(startOfWeek); d.setDate(startOfWeek.getDate()+i); days.push({ name:['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][i], date:d.toISOString().split('T')[0], km:0 }); }
      data.forEach(a=>{ const day=days.find(d=>d.date===a.activity_date); if(day) day.km+=a.distance_km||0; });
      return days;
    };
    
    const loadLeaderboard = async (limit=100) => {
      let q = sb.from('leaderboard').select('*');
      if(leaderboardFilterGender !== 'all') q = q.eq('gender', leaderboardFilterGender);
      if(leaderboardFilterAge !== 'all') q = q.eq('age_group', leaderboardFilterAge);
      const { data } = await q.order(leaderboardSort, { ascending: leaderboardOrder==='asc' }).limit(limit);
      return data || [];
    };
    
    const loadAllActivities = async () => { const { data } = await sb.from('activities').select('*').eq('user_id', currentUser.id).order('activity_date', { ascending: false }); return data || []; };
    const changeLeaderboardSort = f => { if(leaderboardSort===f) leaderboardOrder = leaderboardOrder==='desc'?'asc':'desc'; else { leaderboardSort=f; leaderboardOrder='desc'; } if(currentPage==='leaderboard') renderLeaderboardPage(); };
    
    // ============= WEBHOOK FUNCTIONS =============
    const setupWebhook = async () => {
      const statusDiv = document.getElementById('webhook-setup-status'), btn = document.getElementById('setup-webhook-btn');
      if(btn) { btn.disabled=true; btn.innerHTML='<span class="loader"></span> Настройка...'; }
      if(statusDiv) statusDiv.innerHTML='<div class="loader"></div> Настройка Webhook...';
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/parse-activity/webhook/subscribe`, { method:'POST', headers:{'Content-Type':'application/json'} });
        const result = await res.json();
        if(result.success) { statusDiv.innerHTML='<div style="color:#ffd966;">✅ Webhook успешно настроен! Новые тренировки будут приходить автоматически.</div>'; showToast('Webhook настроен!', 5000); setTimeout(()=>renderSyncPage(),2000); }
        else throw new Error(result.error);
      } catch(e) { statusDiv.innerHTML=`<div style="color:#ff6b6b;">❌ Ошибка: ${e.message}</div>`; showToast(`Ошибка: ${e.message}`,5000); }
      finally { if(btn) { btn.disabled=false; btn.innerHTML='🔌 Настроить Webhook'; } }
    };
    
    const deleteWebhook = async () => {
      if(!confirm('Отключить Webhook? Новые тренировки перестанут приходить автоматически.')) return;
      const btn = document.getElementById('delete-webhook-btn'), block = document.getElementById('webhook-status-block');

    const renderSettingsPage = async () => {
      const { data: profile } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
      document.getElementById('app').innerHTML = `<div class="fixed-header"><div class="user-info"><div class="user-name">${escapeHtml(profile?.name_full||currentUser.email?.split('@')[0])}</div></div><div class="burger" onclick="openMenu()"><span></span><span></span><span></span></div></div><div class="container"><div class="card"><h2 style="color:white;">⚙️ Настройки профиля</h2>${['name','lastname','city'].map(f=>`<div style="margin-bottom:20px;"><label>${f==='name'?'Имя':f==='lastname'?'Фамилия':'Город'}</label><input id="settings-${f}" placeholder="${f==='name'?'Имя':f==='lastname'?'Фамилия':'Город'}" value="${escapeHtml(profile?.[f==='name'?'first_name':f==='lastname'?'last_name':'city']||'')}"></div>`).join('')}
      <div style="margin-bottom:20px;"><label>Пол</label><select id="settings-gender"><option value="male" ${profile?.gender==='male'?'selected':''}>Мужчина</option><option value="female" ${profile?.gender==='female'?'selected':''}>Женщина</option></select></div>
      <div style="margin-bottom:20px;"><label>Дата рождения</label><input type="date" id="settings-birthdate" value="${profile?.birth_date||''}"></div>
      <div style="margin-bottom:20px;"><label>Strava username</label><div class="info-text">🔍 Как найти: Strava → Настройки → Custom URL</div><input id="settings-strava-username" placeholder="Strava username" value="${escapeHtml(profile?.strava_username||'')}"></div>
      <button onclick="saveSettings()">💾 Сохранить</button><div id="settings-error" class="error"></div></div></div><div id="menu-overlay" class="menu-overlay"></div><div id="menu" class="menu"><div class="menu-header"><strong>Меню</strong></div>${['home','leaderboard','activities','achievements','points','abilities','news','settings'].map(p=>`<div class="menu-item" onclick="navigateTo('${p}');closeMenu();"><span>${p==='home'?'🏠':p==='leaderboard'?'🏆':p==='activities'?'📋':p==='achievements'?'🏅':p==='points'?'⭐':p==='abilities'?'⚡':p==='news'?'📰':'⚙️'}</span><span>${p==='home'?'Главная':p==='leaderboard'?'Таблица лидеров':p==='activities'?'Мои тренировки':p==='achievements'?'Достижения':p==='points'?'Баллы':p==='abilities'?'Способности':p==='news'?'Лента новостей':'Настройки'}</span></div>`).join('')}${isAdmin?'<div class="menu-item" onclick="navigateTo(\'sync\');closeMenu();"><span>🔄</span><span>Синхронизация</span></div>':''}<div class="menu-item" onclick="logout();closeMenu();"><span>🚪</span><span>Выход</span></div></div>`;
    };
    
    const saveSettings = async () => {
      const firstName = document.getElementById('settings-name')?.value || '';
      const lastName = document.getElementById('settings-lastname')?.value || '';
      const gender = document.getElementById('settings-gender')?.value || '';
      const birthDate = document.getElementById('settings-birthdate')?.value || '';
      const city = document.getElementById('settings-city')?.value || '';
      const stravaUsername = document.getElementById('settings-strava-username')?.value || '';
      const errorDiv = document.getElementById('settings-error');
      if(!errorDiv) return;
      errorDiv.innerHTML = '<span class="loader"></span> Сохранение...';
      const { error } = await sb.from('profiles').update({ first_name: firstName, last_name: lastName, name_full: `${firstName} ${lastName}`.trim(), gender, birth_date: birthDate, city, strava_username: stravaUsername || null }).eq('id', currentUser.id);
      if(error) { errorDiv.innerHTML = '❌ ' + error.message; errorDiv.style.color = '#ff6b6b'; }
      else { errorDiv.innerHTML = '✅ Настройки сохранены'; errorDiv.style.color = '#ffd966'; showToast('Профиль обновлен!', 2000); setTimeout(()=>errorDiv.innerHTML='',3000); }
    };
    
    const renderAchievementsPage = async () => {
      const profile = await loadProfile(), stats = await loadStats();
      const total = Math.floor(stats.trainingsCount/5);
      document.getElementById('app').innerHTML = `<div class="fixed-header"><div class="user-info"><div class="user-name">${escapeHtml(profile?.name_full||currentUser.email?.split('@')[0])}</div></div><div class="burger" onclick="openMenu()"><span></span><span></span><span></span></div></div><div class="container"><div class="card"><h2 style="color:white;">Достижения</h2><div class="stat-value" style="text-align:center;font-size:48px;color:#ffd966;">${total}/20</div><div class="stats-row"><div class="stat-item"><div>🏅</div><div>Первый км</div><div>${stats.totalKm>0?'✅':'❌'}</div></div><div class="stat-item"><div>🏅</div><div>10 км</div><div>${stats.totalKm>=10?'✅':'❌'}</div></div><div class="stat-item"><div>🏅</div><div>Полумарафон</div><div>${stats.totalKm>=21.1?'✅':'❌'}</div></div><div class="stat-item"><div>🏅</div><div>Марафон</div><div>${stats.totalKm>=42.2?'✅':'❌'}</div></div></div></div></div><div id="menu-overlay" class="menu-overlay"></div><div id="menu" class="menu"><div class="menu-header"><strong>Меню</strong></div>${['home','leaderboard','activities','achievements','points','abilities','news','settings'].map(p=>`<div class="menu-item" onclick="navigateTo('${p}');closeMenu();"><span>${p==='home'?'🏠':p==='leaderboard'?'🏆':p==='activities'?'📋':p==='achievements'?'🏅':p==='points'?'⭐':p==='abilities'?'⚡':p==='news'?'📰':'⚙️'}</span><span>${p==='home'?'Главная':p==='leaderboard'?'Таблица лидеров':p==='activities'?'Мои тренировки':p==='achievements'?'Достижения':p==='points'?'Баллы':p==='abilities'?'Способности':p==='news'?'Лента новостей':'Настройки'}</span></div>`).join('')}${isAdmin?'<div class="menu-item" onclick="navigateTo(\'sync\');closeMenu();"><span>🔄</span><span>Синхронизация</span></div>':''}<div class="menu-item" onclick="logout();closeMenu();"><span>🚪</span><span>Выход</span></div></div>`;
    };
    
    const renderPointsPage = async () => {
      const profile = await loadProfile(), stats = await loadStats();
      const points = Math.floor(stats.totalKm * 10);
      document.getElementById('app').innerHTML = `<div class="fixed-header"><div class="user-info"><div class="user-name">${escapeHtml(profile?.name_full||currentUser.email?.split('@')[0])}</div></div><div class="burger" onclick="openMenu()"><span></span><span></span><span></span></div></div><div class="container"><div class="card"><h2 style="color:white;">Баллы</h2><div class="stat-value" style="text-align:center;font-size:64px;color:#ffd966;">${points}</div><div class="info-text"><strong style="color:#ffd966;">Правила:</strong><br>• 1 км = 10 баллов<br>• +50 за неделю с тренировками<br>• +100 за рекорд</div></div></div><div id="menu-overlay" class="menu-overlay"></div><div id="menu" class="menu"><div class="menu-header"><strong>Меню</strong></div>${['home','leaderboard','activities','achievements','points','abilities','news','settings'].map(p=>`<div class="menu-item" onclick="navigateTo('${p}');closeMenu();"><span>${p==='home'?'🏠':p==='leaderboard'?'🏆':p==='activities'?'📋':p==='achievements'?'🏅':p==='points'?'⭐':p==='abilities'?'⚡':p==='news'?'📰':'⚙️'}</span><span>${p==='home'?'Главная':p==='leaderboard'?'Таблица лидеров':p==='activities'?'Мои тренировки':p==='achievements'?'Достижения':p==='points'?'Баллы':p==='abilities'?'Способности':p==='news'?'Лента новостей':'Настройки'}</span></div>`).join('')}${isAdmin?'<div class="menu-item" onclick="navigateTo(\'sync\');closeMenu();"><span>🔄</span><span>Синхронизация</span></div>':''}<div class="menu-item" onclick="logout();closeMenu();"><span>🚪</span><span>Выход</span></div></div>`;
    };
    
    const renderAbilitiesPage = async () => {
      const profile = await loadProfile(), stats = await loadStats();
      const endurance = Math.min(5, Math.floor(stats.totalKm/100)+1);
      const speed = Math.min(5, Math.floor(parseFloat(stats.avgPace?.split(':')[0]||7)/2));
      const strength = Math.min(5, Math.floor(stats.trainingsCount/20)+1);
      document.getElementById('app').innerHTML = `<div class="fixed-header"><div class="user-info"><div class="user-name">${escapeHtml(profile?.name_full||currentUser.email?.split('@')[0])}</div></div><div class="burger" onclick="openMenu()"><span></span><span></span><span></span></div></div><div class="container"><div class="card"><h2 style="color:white;">Способности</h2><div class="stats-row"><div class="stat-item"><div>🏃‍♂️</div><div>Выносливость</div><div>Уровень ${endurance}</div></div><div class="stat-item"><div>⚡</div><div>Скорость</div><div>Уровень ${speed}</div></div><div class="stat-item"><div>⛰️</div><div>Сила</div><div>Уровень ${strength}</div></div><div class="stat-item"><div>❤️</div><div>Восстановление</div><div>Уровень ${Math.floor(endurance/2)+1}</div></div></div><div class="info-text"><strong>Как повысить:</strong><br>• Выносливость: километраж (100/200/300 км)<br>• Скорость: темп быстрее 5:00/км<br>• Сила: количество тренировок (20/40/60)</div></div></div><div id="menu-overlay" class="menu-overlay"></div><div id="menu" class="menu"><div class="menu-header"><strong>Меню</strong></div>${['home','leaderboard','activities','achievements','points','abilities','news','settings'].map(p=>`<div class="menu-item" onclick="navigateTo('${p}');closeMenu();"><span>${p==='home'?'🏠':p==='leaderboard'?'🏆':p==='activities'?'📋':p==='achievements'?'🏅':p==='points'?'⭐':p==='abilities'?'⚡':p==='news'?'📰':'⚙️'}</span><span>${p==='home'?'Главная':p==='leaderboard'?'Таблица лидеров':p==='activities'?'Мои тренировки':p==='achievements'?'Достижения':p==='points'?'Баллы':p==='abilities'?'Способности':p==='news'?'Лента новостей':'Настройки'}</span></div>`).join('')}${isAdmin?'<div class="menu-item" onclick="navigateTo(\'sync\');closeMenu();"><span>🔄</span><span>Синхронизация</span></div>':''}<div class="menu-item" onclick="logout();closeMenu();"><span>🚪</span><span>Выход</span></div></div>`;
    };
    
    const renderNewsPage = async () => {
      const profile = await loadProfile();
      document.getElementById('app').innerHTML = `<div class="fixed-header"><div class="user-info"><div class="user-name">${escapeHtml(profile?.name_full||currentUser.email?.split('@')[0])}</div></div><div class="burger" onclick="openMenu()"><span></span><span></span><span></span></div></div><div class="container"><div class="card"><h2 style="color:white;">📰 Лента новостей</h2><div class="news-feed">${newsFeed.map(i=>`<div class="news-item"><div class="news-icon">${i.icon}</div><div class="news-content"><div class="news-text">${escapeHtml(i.user)} ${escapeHtml(i.text)}</div><div class="news-time">${escapeHtml(i.time)}</div></div></div>`).join('')}</div></div></div><div id="menu-overlay" class="menu-overlay"></div><div id="menu" class="menu"><div class="menu-header"><strong>Меню</strong></div>${['home','leaderboard','activities','achievements','points','abilities','news','settings'].map(p=>`<div class="menu-item" onclick="navigateTo('${p}');closeMenu();"><span>${p==='home'?'🏠':p==='leaderboard'?'🏆':p==='activities'?'📋':p==='achievements'?'🏅':p==='points'?'⭐':p==='abilities'?'⚡':p==='news'?'📰':'⚙️'}</span><span>${p==='home'?'Главная':p==='leaderboard'?'Таблица лидеров':p==='activities'?'Мои тренировки':p==='achievements'?'Достижения':p==='points'?'Баллы':p==='abilities'?'Способности':p==='news'?'Лента новостей':'Настройки'}</span></div>`).join('')}${isAdmin?'<div class="menu-item" onclick="navigateTo(\'sync\');closeMenu();"><span>🔄</span><span>Синхронизация</span></div>':''}<div class="menu-item" onclick="logout();closeMenu();"><span>🚪</span><span>Выход</span></div></div>`;
    };
    
    const renderUserProfile = async () => {
      const { data: profile } = await sb.from('profiles').select('*').eq('id', viewedUserId).single();
      if(!profile) { showToast('Пользователь не найден',2000); navigateTo('home'); return; }
      const { data: activities } = await sb.from('activities').select('*').eq('user_id', viewedUserId).order('activity_date', { ascending: false }).limit(20);
      const totalKm = (activities||[]).reduce((s,a)=>s+(a.distance_km||0),0).toFixed(2);
      document.getElementById('app').innerHTML = `<div class="fixed-header"><div class="user-info"><div class="user-name">${escapeHtml(profile.name_full)}</div><div class="user-details">${profile.gender==='male'?'Мужчина':'Женщина'}, ${profile.birth_date?Math.floor((new Date()-new Date(profile.birth_date))/(365.25*24*60*60*1000)):'—'} лет${profile.city?` | ${escapeHtml(profile.city)}`:''}</div></div><div class="burger" onclick="openMenu()"><span></span><span></span><span></span></div></div><div class="container"><div class="card"><div class="stats-row"><div class="stat-item"><div class="stat-value">${totalKm}</div><div>км</div></div><div class="stat-item"><div class="stat-value">${activities?.length||0}</div><div>тренировок</div></div><div class="stat-item"><div class="stat-value">${formatDuration((activities||[]).reduce((s,a)=>s+(a.duration_min||0),0))}</div><div>время</div></div></div></div><div class="card"><h3 style="color:white;">Последние тренировки</h3><div class="activities-list">${(activities||[]).map(a=>`<div class="activity-item"><div><div class="activity-name">${escapeHtml(a.name||'Без названия')}</div><div class="activity-meta">${formatDate(a.activity_date)} | ${(a.distance_km||0).toFixed(2)} км${a.duration_min?` | ${formatDuration(a.duration_min)}`:''}</div></div></div>`).join('')||'<div style="text-align:center;padding:20px;">Нет тренировок</div>'}</div></div></div><div id="menu-overlay" class="menu-overlay"></div><div id="menu" class="menu"><div class="menu-header"><strong>Меню</strong></div>${['home','leaderboard','activities','achievements','points','abilities','news','settings'].map(p=>`<div class="menu-item" onclick="navigateTo('${p}');closeMenu();"><span>${p==='home'?'🏠':p==='leaderboard'?'🏆':p==='activities'?'📋':p==='achievements'?'🏅':p==='points'?'⭐':p==='abilities'?'⚡':p==='news'?'📰':'⚙️'}</span><span>${p==='home'?'Главная':p==='leaderboard'?'Таблица лидеров':p==='activities'?'Мои тренировки':p==='achievements'?'Достижения':p==='points'?'Баллы':p==='abilities'?'Способности':p==='news'?'Лента новостей':'Настройки'}</span></div>`).join('')}${isAdmin?'<div class="menu-item" onclick="navigateTo(\'sync\');closeMenu();"><span>🔄</span><span>Синхронизация</span></div>':''}<div class="menu-item" onclick="logout();closeMenu();"><span>🚪</span><span>Выход</span></div></div>`;
    };
    
    const initSession = async () => {
      const { data: { session } } = await sb.auth.getSession();
      if(session) { currentUser = session.user; await checkAdminStatus(); }
      handleRouting();
    };
    
    const render = async () => {
      if(!currentUser) { renderAuth(); return; }
      const pages = { home: renderHome, leaderboard: renderLeaderboardPage, achievements: renderAchievementsPage, points: renderPointsPage, abilities: renderAbilitiesPage, activities: renderActivitiesPage, news: renderNewsPage, settings: renderSettingsPage, userProfile: renderUserProfile };
      if(currentPage === 'sync' && isAdmin) await renderSyncPage();
      else if(pages[currentPage]) await pages[currentPage]();
      else await renderHome();
    };
    
    window.register = register; window.login = login; window.logout = logout;
    window.navigateTo = navigateTo; window.openMenu = openMenu; window.closeMenu = closeMenu;
    window.saveSettings = saveSettings; window.changeLeaderboardSort = changeLeaderboardSort;
    window.leaderboardFilterGender = leaderboardFilterGender; window.leaderboardFilterAge = leaderboardFilterAge;
    
    initSession();
    window.addEventListener('popstate', handleRouting);
  </script>
</body>
</html>
