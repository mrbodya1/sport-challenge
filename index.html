<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Спортивный челлендж | YANAO-UGRA-BATTLE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      min-height: 100vh;
      padding-top: 70px;
      padding-bottom: 20px;
    }

    .fixed-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(15, 32, 39, 0.85);
      backdrop-filter: blur(12px);
      padding: 10px 20px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .burger {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .burger:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.02);
    }

    .burger span {
      width: 22px;
      height: 2px;
      background: white;
      border-radius: 2px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Профиль */
    .profile-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
    }

    .profile-header {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-bottom: 20px;
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #ffd966, #ffb347);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: #2c3e50;
    }

    .profile-info {
      flex: 1;
    }

    .profile-name {
      font-size: 22px;
      font-weight: 600;
      color: white;
      margin-bottom: 4px;
    }

    .profile-stats {
      display: flex;
      gap: 16px;
      margin-top: 8px;
    }

    .profile-stat {
      text-align: center;
    }

    .profile-stat-value {
      font-size: 18px;
      font-weight: 700;
      color: #ffd966;
    }

    .profile-stat-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
    }

    .profile-bio {
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Кнопка добавления */
    .add-button {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #ffd966, #ffb347);
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }

    .add-button:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(255, 217, 102, 0.4);
    }

    /* Карточки */
    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .card h3 {
      color: white;
      margin-bottom: 16px;
      font-size: 16px;
    }

    /* Статистика */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat-item {
      background: rgba(255, 255, 255, 0.1);
      padding: 16px;
      border-radius: 20px;
      text-align: center;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 800;
      color: #ffd966;
    }

    .stat-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 4px;
    }

    /* График */
    .chart-bars {
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      height: 150px;
      margin-top: 16px;
    }

    .bar-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 12%;
    }

    .bar {
      width: 100%;
      background: linear-gradient(180deg, #ffd966, #ffb347);
      border-radius: 8px 8px 0 0;
      transition: height 0.3s ease;
      min-height: 4px;
    }

    .bar-value {
      font-size: 10px;
      font-weight: 600;
      color: #ffd966;
      margin-bottom: 4px;
    }

    .bar-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 8px;
    }

    /* Вкладки */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 8px;
    }

    .tab {
      padding: 8px 16px;
      background: transparent;
      color: rgba(255, 255, 255, 0.6);
      border: none;
      font-size: 14px;
      cursor: pointer;
      border-radius: 20px;
      transition: all 0.2s;
    }

    .tab.active {
      background: rgba(255, 217, 102, 0.2);
      color: #ffd966;
    }

    /* Лента новостей */
    .news-feed {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .news-item {
      background: rgba(255, 255, 255, 0.08);
      padding: 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
      cursor: pointer;
    }

    .news-item:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateX(4px);
    }

    .news-icon {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .news-content {
      flex: 1;
    }

    .news-title {
      font-size: 14px;
      font-weight: 500;
      color: white;
      margin-bottom: 4px;
    }

    .news-text {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    .news-time {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 4px;
    }

    /* Тренировки */
    .activities-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .activity-item {
      background: rgba(255, 255, 255, 0.08);
      padding: 14px;
      border-radius: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .activity-item:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateX(4px);
    }

    .activity-info {
      flex: 1;
    }

    .activity-name {
      font-weight: 600;
      color: #ffd966;
      margin-bottom: 4px;
    }

    .activity-meta {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    .activity-stats {
      text-align: right;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
    }

    /* Форма добавления */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 16px;
      font-family: inherit;
    }

    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: #ffd966;
    }

    .form-group input::placeholder, .form-group textarea::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .pace-preview {
      margin-top: 8px;
      font-size: 12px;
      color: #ffd966;
    }

    /* Модальное окно */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      max-width: 90%;
      max-height: 90%;
      background: rgba(15, 32, 39, 0.95);
      border-radius: 28px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .modal-content img {
      max-width: 100%;
      max-height: 70vh;
      border-radius: 16px;
    }

    .modal-close {
      margin-top: 16px;
      padding: 10px 20px;
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      border: none;
      border-radius: 40px;
      color: white;
      cursor: pointer;
    }

    button {
      background: linear-gradient(135deg, #ffd966, #ffb347);
      color: #2c3e50;
      border: none;
      padding: 14px;
      border-radius: 40px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    .error {
      color: #ff6b6b;
      margin-top: 12px;
      text-align: center;
    }

    .loader {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffd966;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
    }

    .menu {
      position: fixed;
      top: 0;
      right: 0;
      width: 280px;
      height: 100%;
      background: rgba(15, 32, 39, 0.95);
      backdrop-filter: blur(20px);
      z-index: 201;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
    }

    .menu.open {
      transform: translateX(0);
    }

    .menu-header {
      padding: 24px 20px;
      background: linear-gradient(135deg, #ffd966, #ffb347);
      color: #2c3e50;
      font-weight: 700;
    }

    .menu-item {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: all 0.2s;
      color: white;
    }

    .menu-item:hover {
      background: rgba(255, 255, 255, 0.1);
      padding-left: 28px;
    }

    @media (max-width: 600px) {
      .stats-row {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .profile-header {
        flex-direction: column;
        text-align: center;
      }
      
      .add-button {
        position: static;
        margin-top: 16px;
        width: 100%;
      }
    }
  </style>

<body>
  <div id="app"></div>

  <script>
    const SUPABASE_URL = 'https://idkghmydocvjhuwtgojh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlka2dobXlkb2N2amh1d3Rnb2poIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyNTU3NzgsImV4cCI6MjA4OTgzMTc3OH0.omQ4zi4gILIk8nQtbYPstcORhEyEhFvKDnFs5qwFlSM';
    
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let currentUser = null;
    let currentPage = 'home';
    let menuOpen = false;
    let selectedActivity = null;
    let newsTab = 'my';
    
    // Моковые новости (позже из БД)
    let newsFeed = [
      { id: 1, user_id: 'user1', user_name: 'Анна С.', text: 'добавила тренировку: 5.2 км', time: '5 минут назад', icon: '🏃‍♀️', type: 'activity' },
      { id: 2, user_id: 'user2', user_name: 'Дмитрий П.', text: 'установил личный рекорд на 10 км', time: '2 часа назад', icon: '🏆', type: 'achievement' },
      { id: 3, user_id: 'user3', user_name: 'Елена К.', text: 'добавила тренировку: 8.5 км', time: 'вчера', icon: '🏃‍♀️', type: 'activity' },
    ];
    
    // ============= HELPER FUNCTIONS =============
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }
    
    function formatDuration(minutes) {
      if (!minutes) return '—';
      const hrs = Math.floor(minutes / 60);
      const mins = Math.round(minutes % 60);
      if (hrs > 0) return `${hrs}ч ${mins.toString().padStart(2, '0')}мин`;
      return `${mins}мин`;
    }
    
    function formatDate(dateStr) {
      if (!dateStr) return '—';
      const d = new Date(dateStr);
      return `${d.getDate().toString().padStart(2, '0')}.${(d.getMonth() + 1).toString().padStart(2, '0')}.${d.getFullYear()}`;
    }
    
    function formatPace(distance, minutes) {
      if (!distance || !minutes || distance <= 0 || minutes <= 0) return '—';
      const paceSeconds = (minutes * 60) / distance;
      const paceMin = Math.floor(paceSeconds / 60);
      const paceSec = Math.round(paceSeconds % 60);
      return `${paceMin}:${paceSec.toString().padStart(2, '0')}`;
    }
    
    function showToast(message, duration = 3000) {
      const toast = document.createElement('div');
      toast.style.cssText = `
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        color: white;
        padding: 12px 24px;
        border-radius: 40px;
        font-size: 14px;
        z-index: 1000;
        white-space: nowrap;
      `;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), duration);
    }
    
    // ============= ROUTING =============
    function navigateTo(page, params = null) {
      let hash = '#/';
      if (page === 'home') hash = '#/';
      else if (page === 'profile') hash = '#/profile';
      else if (page === 'add') hash = '#/add';
      else if (page === 'activities') hash = '#/activities';
      else if (page === 'settings') hash = '#/settings';
      else if (page === 'news') hash = '#/news';
      
      window.location.hash = hash;
      currentPage = page;
      if (params) selectedActivity = params;
      render();
    }
    
    function handleRouting() {
      const hash = window.location.hash.slice(2);
      if (hash === 'profile') currentPage = 'profile';
      else if (hash === 'add') currentPage = 'add';
      else if (hash === 'activities') currentPage = 'activities';
      else if (hash === 'settings') currentPage = 'settings';
      else if (hash === 'news') currentPage = 'news';
      else currentPage = 'home';
      render();
    }
    
    function closeMenu() {
      menuOpen = false;
      document.getElementById('menu')?.classList.remove('open');
      document.getElementById('menu-overlay')?.style.setProperty('display', 'none');
    }
    
    function openMenu() {
      menuOpen = true;
      document.getElementById('menu')?.classList.add('open');
      document.getElementById('menu-overlay')?.style.setProperty('display', 'block');
    }
    
    // ============= AUTH =============
    async function register() {
      const username = document.getElementById('reg-username').value;
      const password = document.getElementById('reg-password').value;
      const firstName = document.getElementById('reg-firstname').value;
      const lastName = document.getElementById('reg-lastname').value;
      const bio = document.getElementById('reg-bio').value;
      const errorDiv = document.getElementById('register-error');
      
      if (!username || !password || !firstName || !lastName) {
        errorDiv.innerHTML = 'Заполните все поля';
        return;
      }
      
      errorDiv.innerHTML = '<span class="loader"></span> Регистрация...';
      
      const { error } = await sb.auth.signUp({
        email: username + '@challenge.local',
        password: password,
        options: {
          data: {
            username: username,
            first_name: firstName,
            last_name: lastName,
            name_full: `${firstName} ${lastName}`,
            bio: bio || '',
            avatar_color: ['#ffd966', '#ffb347', '#ff6b6b', '#4ecdc4'][Math.floor(Math.random() * 4)]
          }
        }
      });
      
      if (error) {
        errorDiv.innerHTML = error.message.includes('already registered') ? 'Логин уже занят' : error.message;
      } else {
        errorDiv.style.color = '#ffd966';
        errorDiv.innerHTML = 'Регистрация успешна! Теперь войдите.';
        showToast('Регистрация успешна!', 3000);
        setTimeout(() => navigateTo('home'), 1500);
      }
    }
    
    async function login() {
      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;
      const errorDiv = document.getElementById('login-error');
      
      if (!username || !password) {
        errorDiv.innerHTML = 'Введите логин и пароль';
        return;
      }
      
      errorDiv.innerHTML = '<span class="loader"></span> Вход...';
      
      const { data, error } = await sb.auth.signInWithPassword({
        email: username + '@challenge.local',
        password: password
      });
      
      if (error) {
        errorDiv.innerHTML = 'Неверный логин или пароль';
      } else {
        currentUser = data.user;
        showToast(`Добро пожаловать, ${username}!`, 3000);
        navigateTo('home');
      }
    }
    
    async function logout() {
      await sb.auth.signOut();
      currentUser = null;
      showToast('Вы вышли из системы', 2000);
      navigateTo('home');
    }
    
    // ============= DATA LOADING =============
    async function loadProfile() {
      const { data } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
      return data;
    }
    
    async function loadStats() {
      const { data } = await sb.from('activities').select('distance_km, duration_min').eq('user_id', currentUser.id);
      if (!data) return { totalKm: 0, totalTime: 0, trainingsCount: 0, avgDistance: 0 };
      
      const totalKm = data.reduce((s, a) => s + (a.distance_km || 0), 0);
      const totalTime = data.reduce((s, a) => s + (a.duration_min || 0), 0);
      const trainingsCount = data.length;
      const avgDistance = trainingsCount > 0 ? (totalKm / trainingsCount).toFixed(2) : 0;
      
      return { totalKm: totalKm.toFixed(2), totalTime: formatDuration(totalTime), trainingsCount, avgDistance };
    }
    
    async function loadWeeklyChart() {
      const today = new Date();
      const startOfWeek = new Date(today);
      startOfWeek.setDate(today.getDate() - today.getDay() + (today.getDay() === 0 ? -6 : 1));
      startOfWeek.setHours(0, 0, 0, 0);
      
      const { data } = await sb.from('activities').select('distance_km, activity_date').eq('user_id', currentUser.id).gte('activity_date', startOfWeek.toISOString().split('T')[0]);
      
      const days = [];
      for (let i = 0; i < 7; i++) {
        const date = new Date(startOfWeek);
        date.setDate(startOfWeek.getDate() + i);
        days.push({ name: ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'][i], date: date.toISOString().split('T')[0], km: 0 });
      }
      
      data?.forEach(a => { const day = days.find(d => d.date === a.activity_date); if (day) day.km += a.distance_km || 0; });
      return days;
    }
    
    async function loadActivities() {
      const { data } = await sb.from('activities').select('*').eq('user_id', currentUser.id).order('activity_date', { ascending: false });
      return data || [];
    }
    
    async function loadNews() {
      // Получаем активности друзей (всех пользователей кроме себя)
      const { data: activities } = await sb
        .from('activities')
        .select('*, profiles!user_id(name_full, avatar_color)')
        .neq('user_id', currentUser.id)
        .order('created_at', { ascending: false })
        .limit(20);
      
      const news = activities?.map(a => ({
        id: a.id,
        user_id: a.user_id,
        user_name: a.profiles?.name_full || 'Пользователь',
        text: `добавил(а) тренировку: ${a.distance_km.toFixed(2)} км за ${formatDuration(a.duration_min)}`,
        time: formatRelativeTime(a.created_at),
        icon: '🏃‍♂️',
        type: 'activity',
        activity: a
      })) || [];
      
      return news;
    }
    
    function formatRelativeTime(dateStr) {
      const date = new Date(dateStr);
      const now = new Date();
      const diff = Math.floor((now - date) / 1000);
      if (diff < 60) return 'только что';
      if (diff < 3600) return `${Math.floor(diff / 60)} мин назад`;
      if (diff < 86400) return `${Math.floor(diff / 3600)} ч назад`;
      return `${Math.floor(diff / 86400)} дн назад`;
    }
    
    // ============= ADD ACTIVITY =============
    async function addActivity() {
      const date = document.getElementById('activity-date').value;
      const distance = parseFloat(document.getElementById('activity-distance').value);
      const duration = parseFloat(document.getElementById('activity-duration').value);
      const screenshot = document.getElementById('activity-screenshot').files[0];
      const errorDiv = document.getElementById('add-error');
      
      if (!date || !distance || !duration) {
        errorDiv.innerHTML = 'Заполните дату, дистанцию и время';
        return;
      }
      
      // Подсчет номера тренировки за день
      const { data: dayActivities } = await sb
        .from('activities')
        .select('id')
        .eq('user_id', currentUser.id)
        .eq('activity_date', date);
      
      const number = (dayActivities?.length || 0) + 1;
      const name = `${formatDate(date)}_тренировка_${number}`;
      const pace = formatPace(distance, duration);
      
      errorDiv.innerHTML = '<span class="loader"></span> Сохранение...';
      
      let screenshotUrl = null;
      if (screenshot) {
        // Загрузка скриншота в Supabase Storage
        const fileExt = screenshot.name.split('.').pop();
        const fileName = `${currentUser.id}/${Date.now()}.${fileExt}`;
        const { error: uploadError } = await sb.storage.from('activity-screenshots').upload(fileName, screenshot);
        if (!uploadError) {
          const { data: urlData } = sb.storage.from('activity-screenshots').getPublicUrl(fileName);
          screenshotUrl = urlData.publicUrl;
        }
      }
      
      const { error } = await sb.from('activities').insert({
        user_id: currentUser.id,
        name: name,
        distance_km: distance,
        duration_min: duration,
        pace_min_per_km: pace,
        activity_date: date,
        screenshot_url: screenshotUrl,
        created_at: new Date().toISOString()
      });
      
      if (error) {
        errorDiv.innerHTML = '❌ ' + error.message;
      } else {
        showToast('Тренировка добавлена!', 3000);
        navigateTo('activities');
      }
    }

      const pages = { home: renderHome, activities: renderActivitiesPage, add: renderAddPage, profile: renderProfilePage, settings: renderSettingsPage, news: renderNewsPage };
      if (pages[currentPage]) await pages[currentPage]();
      else await renderHome();
    }
    
    window.register = register;
    window.login = login;
    window.logout = logout;
    window.navigateTo = navigateTo;
    window.openMenu = openMenu;
    window.closeMenu = closeMenu;
    window.saveSettings = saveSettings;
    window.addActivity = addActivity;
    window.showActivityModal = showActivityModal;
    window.updatePace = () => {};
    
    initSession();
    window.addEventListener('popstate', handleRouting);
  </script>
</body>
</html>
