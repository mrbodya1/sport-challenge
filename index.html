    .skeleton {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 200% 100%;

    @keyframes shimmer {

    label {

      .leaderboard-table th, .leaderboard-table td {
        font-size: 12px;

    const SUPABASE_URL = 'https://idkghmydocvjhuwtgojh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlka2dobXlkb2N2amh1d3Rnb2poIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyNTU3NzgsImV4cCI6MjA4OTgzMTc3OH0.omQ4zi4gILIk8nQtbYPstcORhEyEhFvKDnFs5qwFlSM';
    
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let currentUser = null;

    // Моковые данные для новостей
    const newsFeed = [
      { id: 1, type: 'points', user: 'Анна С.', text: 'набрала 150 баллов за неделю', time: '5 минут назад', icon: '⭐' },
      { id: 2, type: 'achievement', user: 'Дмитрий П.', text: 'получил достижение "10 км"', time: '2 часа назад', icon: '🏅' },

    // ============= ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =============
    
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }
    
    function formatDuration(minutes) {
      if (!minutes) return '—';
      const hrs = Math.floor(minutes / 60);
      const mins = Math.round(minutes % 60);
      if (hrs > 0) {
        return `${hrs}ч ${mins.toString().padStart(2, '0')}мин`;
      }
      return `${mins}мин`;
    }
    
    function formatDate(dateStr) {
      if (!dateStr) return '—';
      const d = new Date(dateStr);
      return `${d.getDate().toString().padStart(2, '0')}.${(d.getMonth() + 1).toString().padStart(2, '0')}.${d.getFullYear()}`;
    }
    
    function getAgeGroup(age) {
      if (!age) return null;
      if (age >= 18 && age <= 24) return '18-24';
      if (age >= 25 && age <= 29) return '25-29';
      if (age >= 30 && age <= 34) return '30-34';
      if (age >= 35 && age <= 39) return '35-39';
      if (age >= 40 && age <= 44) return '40-44';
      if (age >= 45 && age <= 49) return '45-49';
      if (age >= 50 && age <= 54) return '50-54';
      if (age >= 55 && age <= 59) return '55-59';
      if (age >= 60 && age <= 64) return '60-64';
      if (age >= 65 && age <= 69) return '65-69';
      if (age >= 70) return '70+';
      return null;
    }
    
    function formatPaceFromSeconds(seconds) {
      if (!seconds) return '—';
      const min = Math.floor(seconds / 60);
      const sec = Math.round(seconds % 60);
      return `${min}:${sec.toString().padStart(2, '0')}`;
    }
    
    function showToast(message, duration = 3000) {
      const existingToast = document.querySelector('.toast');
      if (existingToast) existingToast.remove();
      
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.remove();
      }, duration);
    }
    
    // ============= МАРШРУТИЗАЦИЯ =============
    
    function navigateTo(page, userId = null) {
      let hash = '#/';
      if (page === 'home') hash = '#/';
      else if (page === 'leaderboard') hash = '#/leaderboard';
      else if (page === 'achievements') hash = '#/achievements';
      else if (page === 'points') hash = '#/points';
      else if (page === 'abilities') hash = '#/abilities';
      else if (page === 'activities') hash = '#/activities';
      else if (page === 'news') hash = '#/news';
      else if (page === 'settings') hash = '#/settings';
      else if (page === 'sync') hash = '#/sync';
      else if (page === 'userProfile' && userId) hash = `#/profile/${userId}`;
      
      window.location.hash = hash;
      currentPage = page;
      if (userId) viewedUserId = userId;
      render();
    }
    
    function handleRouting() {
      const hash = window.location.hash.slice(2);
      
      if (hash.startsWith('leaderboard')) {
        currentPage = 'leaderboard';
      } else if (hash.startsWith('achievements')) {
        currentPage = 'achievements';
      } else if (hash.startsWith('points')) {
        currentPage = 'points';
      } else if (hash.startsWith('abilities')) {
        currentPage = 'abilities';
      } else if (hash.startsWith('activities')) {
        currentPage = 'activities';
      } else if (hash.startsWith('news')) {
        currentPage = 'news';
      } else if (hash.startsWith('profile/')) {
        const userId = hash.split('/')[1];
        viewedUserId = userId;
        currentPage = 'userProfile';
      } else if (hash.startsWith('settings')) {
        currentPage = 'settings';
      } else if (hash.startsWith('sync')) {
        currentPage = 'sync';
      } else {
        currentPage = 'home';
      }
      
      render();
    }
    
    function closeMenu() {
      menuOpen = false;
      const menu = document.getElementById('menu');
      const overlay = document.getElementById('menu-overlay');
      if (menu) menu.classList.remove('open');
      if (overlay) overlay.style.display = 'none';
    }
    
    function openMenu() {
      menuOpen = true;
      const menu = document.getElementById('menu');
      const overlay = document.getElementById('menu-overlay');
      if (menu) menu.classList.add('open');
      if (overlay) overlay.style.display = 'block';
    }
    
    // ============= АВТОРИЗАЦИЯ =============
    
    async function register() {
      const username = document.getElementById('reg-username').value;
      const password = document.getElementById('reg-password').value;
      const firstName = document.getElementById('reg-firstname').value;
      const lastName = document.getElementById('reg-lastname').value;
      const stravaUsername = document.getElementById('reg-strava-username').value;
      const gender = document.getElementById('reg-gender').value;
      const birthDate = document.getElementById('reg-birthdate').value;
      const errorDiv = document.getElementById('register-error');
      
      if (!username || !password || !firstName || !lastName || !stravaUsername || !gender || !birthDate) {
        errorDiv.innerHTML = 'Заполните все поля';
        return;
      }
      
      errorDiv.innerHTML = '<span class="loader"></span> Регистрация...';
      
      const { data, error } = await sb.auth.signUp({
        email: username + '@challenge.local',
        password: password,
        options: {
          data: {
            username: username,
            first_name: firstName,
            last_name: lastName,
            name_full: `${firstName} ${lastName}`,
            strava_username: stravaUsername,
            gender: gender,
            birth_date: birthDate
          }
        }
      });
      
      if (error) {
        errorDiv.innerHTML = error.message.includes('already registered') ? 'Логин уже занят' : error.message;
      } else {
        errorDiv.style.color = '#1e6f5c';
        errorDiv.innerHTML = 'Регистрация успешна! Теперь войдите.';
        showToast('Регистрация успешна! Теперь войдите в систему', 3000);
        setTimeout(() => {
          navigateTo('home');
        }, 1500);
      }
    }
    
    async function login() {
      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;
      const errorDiv = document.getElementById('login-error');
      
      if (!username || !password) {
        errorDiv.innerHTML = 'Введите логин и пароль';
        return;
      }
      
      errorDiv.innerHTML = '<span class="loader"></span> Вход...';
      
      const { data, error } = await sb.auth.signInWithPassword({
        email: username + '@challenge.local',
        password: password
      });
      
      if (error) {
        errorDiv.innerHTML = 'Неверный логин или пароль';
      } else {
        currentUser = data.user;
        await checkAdminStatus();
        showToast(`Добро пожаловать, ${username}!`, 3000);
        navigateTo('home');
      }
    }
    
    async function logout() {
      await sb.auth.signOut();
      currentUser = null;
      isAdmin = false;
      showToast('Вы вышли из системы', 2000);
      navigateTo('home');
    }

    async function loadProfile() {
      const { data, error } = await sb
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .single();
      
      if (error) return null;
      return data;

    async function loadStats() {
      const { data, error } = await sb
        .from('activities')
        .select('distance_km, duration_min, pace_min_per_km')
        .eq('user_id', currentUser.id);
      
      if (error || !data) return { totalKm: 0, totalTime: 0, avgPace: null, trainingsCount: 0 };
      
      const totalKm = data.reduce((sum, a) => sum + (a.distance_km || 0), 0);
      const totalTime = data.reduce((sum, a) => sum + (a.duration_min || 0), 0);
      const trainingsCount = data.length;
      
      let avgPace = null;
      const paces = data.filter(a => a.pace_min_per_km).map(a => {
        const match = a.pace_min_per_km.match(/(\d+):(\d+)/);
        if (match) return parseInt(match[1]) * 60 + parseInt(match[2]);
        return null;
      }).filter(p => p);
      
      if (paces.length > 0) {
        const avgSec = paces.reduce((s, p) => s + p, 0) / paces.length;
        const min = Math.floor(avgSec / 60);
        const sec = Math.round(avgSec % 60);
        avgPace = `${min}:${sec.toString().padStart(2, '0')}`;
      }
      
      return {
        totalKm: totalKm.toFixed(2),
        totalTime: formatDuration(totalTime),
        avgPace: avgPace || '—',
        trainingsCount: trainingsCount
      };
    }
    
    async function loadPlaces(profile) {
      const { data: leaderboard, error } = await sb
        .from('leaderboard')
        .select('*')
        .order('total_km', { ascending: false });
      
      if (error) return { absolute: '—', gender: '—', age: '—', ageGroupName: '' };
      
      let absolute = '—', genderPlace = '—', agePlace = '—', ageGroupName = '';
      
      for (let i = 0; i < leaderboard.length; i++) {
        if (leaderboard[i].user_id === currentUser.id) { 
          absolute = (i + 1).toString(); 
          break; 
        }
      }
      
      const genderLeaderboard = leaderboard.filter(l => l.gender === profile?.gender);
      for (let i = 0; i < genderLeaderboard.length; i++) {
        if (genderLeaderboard[i].user_id === currentUser.id) { 
          genderPlace = (i + 1).toString(); 
          break; 
        }
      }
      
      const age = profile?.birth_date ? Math.floor((new Date() - new Date(profile.birth_date)) / (365.25 * 24 * 60 * 60 * 1000)) : null;
      if (age) {
        const ageGroup = getAgeGroup(age);
        ageGroupName = ageGroup || '';
        const ageLeaderboard = leaderboard.filter(l => l.age_group === ageGroup);
        for (let i = 0; i < ageLeaderboard.length; i++) {
          if (ageLeaderboard[i].user_id === currentUser.id) { 
            agePlace = (i + 1).toString(); 
            break; 
          }
        }
      }
      
      return { absolute, gender: genderPlace, age: agePlace, ageGroupName };
    }
    
    async function loadWeeklyChart() {
      const today = new Date();
      const startOfWeek = new Date(today);
      startOfWeek.setDate(today.getDate() - today.getDay() + (today.getDay() === 0 ? -6 : 1));
      startOfWeek.setHours(0, 0, 0, 0);
      const startOfWeekStr = startOfWeek.toISOString().split('T')[0];
      
      const { data, error } = await sb
        .from('activities')
        .select('distance_km, activity_date')
        .eq('user_id', currentUser.id)
        .gte('activity_date', startOfWeekStr);
      
      if (error) return [];
      
      const days = [];
      for (let i = 0; i < 7; i++) {
        const date = new Date(startOfWeek);
        date.setDate(startOfWeek.getDate() + i);
        days.push({
          name: ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'][i],
          date: date.toISOString().split('T')[0],
          km: 0
        });
      }
      
      data.forEach(a => { 
        const day = days.find(d => d.date === a.activity_date); 
        if (day) day.km += a.distance_km || 0; 
      });
      
      return days;
    }

    async function loadLeaderboard(limit = 200) {
      let query = sb.from('leaderboard').select('*');
      
      if (leaderboardFilterGender !== 'all') {
        query = query.eq('gender', leaderboardFilterGender);
      }
      if (leaderboardFilterAge !== 'all') {
        query = query.eq('age_group', leaderboardFilterAge);
      }

      const ascending = leaderboardOrder === 'asc';
      
      if (leaderboardSort === 'position') {
        query = query.order('total_km', { ascending: !ascending });
      } else {
        query = query.order(leaderboardSort, { ascending });
      }
      
      const { data, error } = await query
        .limit(limit);
      
      if (error) return [];
      return data || [];
    }
    
    function changeLeaderboardSort(field) {
      if (leaderboardSort === field) {
        leaderboardOrder = leaderboardOrder === 'desc' ? 'asc' : 'desc';

    async function saveSettings() {
      const firstName = document.getElementById('settings-name')?.value || '';
      const lastName = document.getElementById('settings-lastname')?.value || '';
      const gender = document.getElementById('settings-gender')?.value || '';
      const birthDate = document.getElementById('settings-birthdate')?.value || '';
      const city = document.getElementById('settings-city')?.value || '';
      const stravaUsername = document.getElementById('settings-strava-username')?.value || '';
      const errorDiv = document.getElementById('settings-error');
      
      if (!errorDiv) return;
      
      errorDiv.innerHTML = '<span class="loader"></span> Сохранение...';
      
      const { error } = await sb
        .from('profiles')
        .update({
          first_name: firstName,
          last_name: lastName,
          name_full: `${firstName} ${lastName}`.trim(),
          gender: gender,
          birth_date: birthDate,
          city: city,
          strava_username: stravaUsername || null,
          updated_at: new Date().toISOString()
        })
        .eq('id', currentUser.id);
      
      if (error) {
        errorDiv.innerHTML = '❌ ' + error.message;
        errorDiv.style.color = '#e74c3c';
      } else {
        errorDiv.innerHTML = '✅ Настройки сохранены';
        errorDiv.style.color = '#1e6f5c';
        showToast('Профиль обновлен!', 2000);
        setTimeout(() => { 
          if (errorDiv) errorDiv.innerHTML = ''; 
        }, 3000);
      }
    }

      if (syncLastBtn) syncLastBtn.onclick = () => syncClubActivities();
      
      const resetBtn = document.getElementById('reset-sync-btn');
      if (resetBtn) resetBtn.onclick = () => resetSyncDate();
      
      const checkRateLimitBtn = document.getElementById('check-rate-limit-btn');
      if (checkRateLimitBtn) checkRateLimitBtn.onclick = () => checkRateLimit();
    }
    
    async function checkRateLimit() {
      const checkBtn = document.getElementById('check-rate-limit-btn');
      const rateLimitDiv = document.getElementById('rate-limit-info');
      const syncStatus = document.getElementById('sync-status');
      
      if (checkBtn) {
        checkBtn.disabled = true;
        checkBtn.innerHTML = '<span class="loader"></span> Проверка...';
      }
      
      if (rateLimitDiv) {
        rateLimitDiv.style.display = 'block';
        rateLimitDiv.innerHTML = '<div class="loader"></div> Получение информации о лимитах...';
      }
      
      try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/parse-activity/rate-limit`, {
          method: 'GET',
          headers: { 'Content-Type': 'application/json' }
        });
        
        const data = await response.json();
        
        if (data.success) {
          const percent = data.usagePercent;
          let color = '#1e6f5c';
          let bgColor = '#e8f5e9';
          
          if (data.status === 'warning') {
            color = '#e67e22';
            bgColor = '#fff3e0';
          } else if (data.status === 'limited') {
            color = '#e74c3c';
            bgColor = '#ffebee';
          }
          
          rateLimitDiv.innerHTML = `
            <div style="background: ${bgColor}; border-radius: 20px; padding: 16px; margin-top: 8px;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <span style="font-weight: 600; color: #2c3e50;">📊 Лимиты Strava API</span>
                <span style="color: ${color}; font-weight: 700;">${data.remaining} / ${data.limit}</span>
              </div>
              <div style="background: #e2e8f0; border-radius: 10px; height: 8px; overflow: hidden; margin-bottom: 12px;">
                <div style="background: ${color}; width: ${percent}%; height: 100%; border-radius: 10px;"></div>
              </div>
              <div style="font-size: 13px; margin-bottom: 8px;">
                <span>📈 Использовано: ${data.used} запросов (${percent}%)</span>
              </div>
              <div style="font-size: 13px; margin-bottom: 8px;">
                <span>⏱ Сброс через: ${data.resetTimeRelative}</span>
              </div>
              <div style="font-size: 12px; color: #6c7a89;">
                ${data.statusMessage}
              </div>
              ${data.status === 'limited' ? `
                <div style="margin-top: 12px; padding: 8px; background: rgba(231, 76, 60, 0.1); border-radius: 12px;">
                  ⚠️ Лимит исчерпан. Подождите ${data.resetTimeRelative} до следующей синхронизации.
                </div>
              ` : ''}
            </div>
          `;
          
          if (syncStatus && data.status === 'limited') {
            syncStatus.innerHTML = `<div style="color: #e74c3c;">⚠️ Лимит API исчерпан! Синхронизация недоступна. Подождите ${data.resetTimeRelative}.</div>`;
            
            const syncCustomBtn = document.getElementById('sync-custom-btn');
            const syncLastBtn = document.getElementById('sync-last-btn');
            if (syncCustomBtn) syncCustomBtn.disabled = true;
            if (syncLastBtn) syncLastBtn.disabled = true;
          } else {
            if (syncStatus && syncStatus.innerHTML.includes('Лимит')) {
              syncStatus.innerHTML = '';
            }
            
            const syncCustomBtn = document.getElementById('sync-custom-btn');
            const syncLastBtn = document.getElementById('sync-last-btn');
            if (syncCustomBtn) syncCustomBtn.disabled = false;
            if (syncLastBtn) syncLastBtn.disabled = false;
          }
          
        } else {
          throw new Error(data.error || 'Не удалось получить информацию о лимитах');
        }
        
      } catch (error) {
        console.error('Error checking rate limit:', error);
        if (rateLimitDiv) {
          rateLimitDiv.innerHTML = `
            <div style="background: #ffebee; border-radius: 20px; padding: 16px; margin-top: 8px;">
              <div style="color: #e74c3c;">
                ❌ Ошибка проверки лимитов: ${error.message}
              </div>
              <div style="font-size: 12px; color: #6c7a89; margin-top: 8px;">
                Убедитесь, что функция parse-activity развернута и доступна.
              </div>
            </div>
          `;
        }
      } finally {
        if (checkBtn) {
          checkBtn.disabled = false;
          checkBtn.innerHTML = '📊 Проверить лимиты API';
        }
      }
    }
    
    async function syncClubActivities(customDate = null) {
      const syncCustomBtn = document.getElementById('sync-custom-btn');
      const syncLastBtn = document.getElementById('sync-last-btn');
      const statusDiv = document.getElementById('sync-status');
      
      if (!statusDiv) return;
      
      if (syncCustomBtn) syncCustomBtn.disabled = true;
      if (syncLastBtn) syncLastBtn.disabled = true;
      
      statusDiv.innerHTML = '<div class="loader"></div> Синхронизация с клубом Strava...';
      
      try {
        const requestBody = customDate ? { fromDate: customDate } : {};
        
        const response = await fetch(`${SUPABASE_URL}/functions/v1/parse-activity/club/sync`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });
        
        const result = await response.json();
        
        if (result.success) {
          statusDiv.innerHTML = `<div style="color: #1e6f5c;">✅ Синхронизировано ${result.saved} тренировок из ${result.total} активностей</div>`;
          showToast(`Синхронизация завершена! Добавлено ${result.saved} тренировок`, 4000);
        } else {
          throw new Error(result.error || 'Неизвестная ошибка');
        }
      } catch (error) {
        console.error('Sync error:', error);
        statusDiv.innerHTML = `<div style="color: #e74c3c;">❌ ${error.message || 'Ошибка соединения'}</div>`;
        showToast(`Ошибка синхронизации: ${error.message}`, 5000);
      } finally {
        if (syncCustomBtn) syncCustomBtn.disabled = false;
        if (syncLastBtn) syncLastBtn.disabled = false;
        setTimeout(() => {
          if (statusDiv && statusDiv.innerHTML && !statusDiv.innerHTML.includes('✅')) {
            statusDiv.innerHTML = '';
          }
        }, 5000);
      }
    }
    
    async function resetSyncDate() {
      const newDate = prompt('Введите новую дату начала синхронизации (ГГГГ-ММ-ДД):\n\nФормат: 2026-03-20', '2026-03-20');
      if (!newDate) return;
      
      const dateRegex = /^\d{4}-\d{2}-\d{2}$/;
      if (!dateRegex.test(newDate)) {
        showToast('Неверный формат даты. Используйте ГГГГ-ММ-ДД', 3000);
        return;
      }
      
      const resetBtn = document.getElementById('reset-sync-btn');
      const statusDiv = document.getElementById('sync-status');
      
      if (resetBtn) {
        resetBtn.disabled = true;
        resetBtn.innerHTML = '<span class="loader"></span> Сброс...';
      }
      
      if (statusDiv) {
        statusDiv.innerHTML = '<div class="loader"></div> Сброс даты синхронизации...';
      }
      
      try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/parse-activity/sync/reset`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ date: newDate })
        });
        
        const result = await response.json();
        
        if (result.success) {
          showToast(`Дата синхронизации сброшена на ${result.newDate}`, 3000);
          if (statusDiv) {
            statusDiv.innerHTML = `<div style="color: #1e6f5c;">✅ Дата синхронизации сброшена на ${result.newDate}</div>`;
          }
        } else {
          throw new Error(result.error);
        }
      } catch (error) {
        console.error('Error resetting sync date:', error);
        showToast(`Ошибка сброса даты: ${error.message}`, 5000);
        if (statusDiv) {
          statusDiv.innerHTML = `<div style="color: #e74c3c;">❌ ${error.message}</div>`;
        }
      } finally {
        if (resetBtn) {
          resetBtn.disabled = false;
          resetBtn.innerHTML = '🗑 Сбросить дату синхронизации';
        }
      }
    }
    
    async function renderUserProfile() {
      const { data: profile, error } = await sb
        .from('profiles')
        .select('*')
        .eq('id', viewedUserId)
        .single();
      
      if (error || !profile) { 
        showToast('Пользователь не найден', 2000);
        navigateTo('home'); 
        return; 
      }
      
      const { data: activities } = await sb
        .from('activities')
        .select('*')
        .eq('user_id', viewedUserId)
        .order('activity_date', { ascending: false })
        .limit(20);
      
      const totalKm = (activities || []).reduce((s, a) => s + (a.distance_km || 0), 0).toFixed(2);
      const trainingsCount = (activities || []).length;
      const totalTime = (activities || []).reduce((s, a) => s + (a.duration_min || 0), 0);
      
      document.getElementById('app').innerHTML = `
        <div class="fixed-header">
          <div class="user-info">
            <div class="user-name">${escapeHtml(profile.name_full)}</div>
            <div class="user-details">
              ${profile.gender === 'male' ? 'Мужчина' : profile.gender === 'female' ? 'Женщина' : '—'}, 
              ${profile.birth_date ? Math.floor((new Date() - new Date(profile.birth_date)) / (365.25 * 24 * 60 * 60 * 1000)) : '—'} лет
              ${profile.city ? ` | ${escapeHtml(profile.city)}` : ''}
            </div>
          </div>
          <div class="burger" onclick="openMenu()">
            <span></span><span></span><span></span>
          </div>
        </div>
        
        <div class="container">
          <div class="card">
            <div class="stats-grid">
              <div class="stat-card"><div class="stat-value">${totalKm}</div><div class="stat-label">км всего</div></div>
              <div class="stat-card"><div class="stat-value">${trainingsCount}</div><div class="stat-label">тренировок</div></div>
              <div class="stat-card"><div class="stat-value">${formatDuration(totalTime)}</div><div class="stat-label">общее время</div></div>
            </div>
          </div>
          
          <div class="card">
            <h3>Последние тренировки</h3>
            <div class="activities-list">
              ${(activities || []).map(a => `
                <div class="activity-item">
                  <div class="activity-info">
                    <div class="activity-name">${escapeHtml(a.name || 'Без названия')}</div>
                    <div class="activity-meta">
                      ${formatDate(a.activity_date)} | ${(a.distance_km || 0).toFixed(2)} км
                      ${a.duration_min ? ' | ' + formatDuration(a.duration_min) : ''}
                      ${a.pace_min_per_km ? ' | темп ' + a.pace_min_per_km : ''}
                    </div>
                  </div>
                </div>
              `).join('') || '<div style="text-align:center; color:#8ba0ae; padding:20px;">Нет тренировок</div>'}
            </div>
            <div class="show-all" onclick="navigateTo('home')">← Назад на главную</div>
          </div>
        </div>
        
        <div id="menu-overlay" class="menu-overlay" onclick="closeMenu()"></div>
        <div id="menu" class="menu">
          <div class="menu-header"><strong>Меню</strong></div>
          <div class="menu-item" onclick="navigateTo('home'); closeMenu();"><span>🏠</span><span>Главная</span></div>
          <div class="menu-item" onclick="navigateTo('leaderboard'); closeMenu();"><span>🏆</span><span>Таблица лидеров</span></div>
          <div class="menu-item" onclick="navigateTo('activities'); closeMenu();"><span>📋</span><span>Мои тренировки</span></div>
          <div class="menu-item" onclick="navigateTo('achievements'); closeMenu();"><span>🏅</span><span>Достижения</span></div>
          <div class="menu-item" onclick="navigateTo('points'); closeMenu();"><span>⭐</span><span>Баллы</span></div>
          <div class="menu-item" onclick="navigateTo('abilities'); closeMenu();"><span>⚡</span><span>Способности</span></div>
          <div class="menu-item" onclick="navigateTo('news'); closeMenu();"><span>📰</span><span>Лента новостей</span></div>
          <div class="menu-item" onclick="navigateTo('settings'); closeMenu();"><span>⚙️</span><span>Настройки</span></div>
          ${isAdmin ? `<div class="menu-item" onclick="navigateTo('sync'); closeMenu();"><span>🔄</span><span>Синхронизация</span></div>` : ''}
          <div class="menu-item" onclick="logout(); closeMenu();"><span>🚪</span><span>Выход</span></div>
        </div>
      `;
    }
    
    async function initSession() {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        currentUser = session.user;
        await checkAdminStatus();
      }
      handleRouting();
    }
    
    async function render() {
      if (!currentUser) {
        renderAuth();
        return;
      }
      
      if (currentPage === 'home') {
        await renderHome();
      } else if (currentPage === 'leaderboard') {
        await renderLeaderboardPage();
      } else if (currentPage === 'achievements') {
        await renderAchievementsPage();
      } else if (currentPage === 'points') {
        await renderPointsPage();
      } else if (currentPage === 'abilities') {
        await renderAbilitiesPage();
      } else if (currentPage === 'activities') {
        await renderActivitiesPage();
      } else if (currentPage === 'news') {
        await renderNewsPage();
      } else if (currentPage === 'settings') {
        await renderSettingsPage();
      } else if (currentPage === 'sync' && isAdmin) {
        await renderSyncPage();
      } else if (currentPage === 'userProfile') {
        await renderUserProfile();
      } else {
        await renderHome();
      }
    }
    
    // Делаем функции глобальными
    window.register = register;
    window.login = login;
    window.logout = logout;
    window.syncClubActivities = syncClubActivities;
    window.resetSyncDate = resetSyncDate;
    window.navigateTo = navigateTo;
    window.openMenu = openMenu;
    window.closeMenu = closeMenu;
    window.saveSettings = saveSettings;
    window.changeLeaderboardSort = changeLeaderboardSort;
    window.checkRateLimit = checkRateLimit;
    window.leaderboardFilterGender = leaderboardFilterGender;
    window.leaderboardFilterAge = leaderboardFilterAge;
    
    // Запуск
    initSession();
    window.addEventListener('popstate', () => handleRouting());
  </script>
</body>
