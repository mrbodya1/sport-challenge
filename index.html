    // ============= ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =============
    
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }
    
    function formatDuration(minutes) {
      if (!minutes) return '—';
      const hrs = Math.floor(minutes / 60);
      const mins = Math.round(minutes % 60);
      if (hrs > 0) {
        return `${hrs}ч ${mins.toString().padStart(2, '0')}мин`;
      }
      return `${mins}мин`;
    }
    
    function formatDate(dateStr) {
      if (!dateStr) return '—';
      const d = new Date(dateStr);
      return `${d.getDate().toString().padStart(2, '0')}.${(d.getMonth() + 1).toString().padStart(2, '0')}.${d.getFullYear()}`;
    }
    
    function getAgeGroup(age) {
      if (!age) return null;
      if (age >= 18 && age <= 24) return '18-24';
      if (age >= 25 && age <= 29) return '25-29';
      if (age >= 30 && age <= 34) return '30-34';
      if (age >= 35 && age <= 39) return '35-39';
      if (age >= 40 && age <= 44) return '40-44';
      if (age >= 45 && age <= 49) return '45-49';
      if (age >= 50 && age <= 54) return '50-54';
      if (age >= 55 && age <= 59) return '55-59';
      if (age >= 60 && age <= 64) return '60-64';
      if (age >= 65 && age <= 69) return '65-69';
      if (age >= 70) return '70+';
      return null;
    }
    
    function formatPaceFromSeconds(seconds) {
      if (!seconds) return '—';
      const min = Math.floor(seconds / 60);
      const sec = Math.round(seconds % 60);
      return `${min}:${sec.toString().padStart(2, '0')}`;
    }
    
    function showToast(message, duration = 3000) {
      const existingToast = document.querySelector('.toast');
      if (existingToast) existingToast.remove();
      
      const toast = document.createElement('div');
      toast.style.cssText = `
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        color: white;
        padding: 12px 24px;
        border-radius: 40px;
        font-size: 14px;
        z-index: 1000;
        white-space: nowrap;
      `;
      toast.textContent = message;
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.remove();
      }, duration);
    }
    
    // ============= МАРШРУТИЗАЦИЯ =============
    
    function navigateTo(page, userId = null) {
      let hash = '#/';
      if (page === 'home') hash = '#/';
      else if (page === 'leaderboard') hash = '#/leaderboard';
      else if (page === 'achievements') hash = '#/achievements';
      else if (page === 'points') hash = '#/points';
      else if (page === 'abilities') hash = '#/abilities';
      else if (page === 'activities') hash = '#/activities';
      else if (page === 'news') hash = '#/news';
      else if (page === 'settings') hash = '#/settings';
      else if (page === 'sync') hash = '#/sync';
      else if (page === 'userProfile' && userId) hash = `#/profile/${userId}`;
      
      window.location.hash = hash;
      currentPage = page;
      if (userId) viewedUserId = userId;
      render();
    }
    
    function handleRouting() {
      const hash = window.location.hash.slice(2);
      
      if (hash.startsWith('leaderboard')) {
        currentPage = 'leaderboard';
      } else if (hash.startsWith('achievements')) {
        currentPage = 'achievements';
      } else if (hash.startsWith('points')) {
        currentPage = 'points';
      } else if (hash.startsWith('abilities')) {
        currentPage = 'abilities';
      } else if (hash.startsWith('activities')) {
        currentPage = 'activities';
      } else if (hash.startsWith('news')) {
        currentPage = 'news';
      } else if (hash.startsWith('profile/')) {
        const userId = hash.split('/')[1];
        viewedUserId = userId;
        currentPage = 'userProfile';
      } else if (hash.startsWith('settings')) {
        currentPage = 'settings';
      } else if (hash.startsWith('sync')) {
        currentPage = 'sync';
      } else {
        currentPage = 'home';
      }
      
      render();
    }

    async function loadProfile() {

    async function loadStats() {
      const { data, error } = await sb
        .from('activities')
        .select('distance_km, duration_min, pace_min_per_km')
        .eq('user_id', currentUser.id);
      
      if (error || !data) return { totalKm: 0, totalTime: 0, avgPace: null, trainingsCount: 0 };
      
      const totalKm = data.reduce((sum, a) => sum + (a.distance_km || 0), 0);
      const totalTime = data.reduce((sum, a) => sum + (a.duration_min || 0), 0);
      const trainingsCount = data.length;
      
      let avgPace = null;
      const paces = data.filter(a => a.pace_min_per_km).map(a => {
        const match = a.pace_min_per_km.match(/(\d+):(\d+)/);
        if (match) return parseInt(match[1]) * 60 + parseInt(match[2]);
        return null;
      }).filter(p => p);
      
      if (paces.length > 0) {
        const avgSec = paces.reduce((s, p) => s + p, 0) / paces.length;
        const min = Math.floor(avgSec / 60);
        const sec = Math.round(avgSec % 60);
        avgPace = `${min}:${sec.toString().padStart(2, '0')}`;
      }
      
      return {
        totalKm: totalKm.toFixed(2),
        totalTime: formatDuration(totalTime),
        avgPace: avgPace || '—',
        trainingsCount: trainingsCount
      };
    }
    
    async function loadPlaces(profile) {
      const { data: leaderboard, error } = await sb
        .from('leaderboard')
        .select('*')
        .order('total_km', { ascending: false });
      
      if (error) return { absolute: '—', gender: '—', age: '—', ageGroupName: '' };
      
      let absolute = '—', genderPlace = '—', agePlace = '—', ageGroupName = '';
      
      for (let i = 0; i < leaderboard.length; i++) {
        if (leaderboard[i].user_id === currentUser.id) { 
          absolute = (i + 1).toString(); 
          break; 
        }
      }
      
      const genderLeaderboard = leaderboard.filter(l => l.gender === profile?.gender);
      for (let i = 0; i < genderLeaderboard.length; i++) {
        if (genderLeaderboard[i].user_id === currentUser.id) { 
          genderPlace = (i + 1).toString(); 
          break; 
        }
      }
      
      const age = profile?.birth_date ? Math.floor((new Date() - new Date(profile.birth_date)) / (365.25 * 24 * 60 * 60 * 1000)) : null;
      if (age) {
        const ageGroup = getAgeGroup(age);
        ageGroupName = ageGroup || '';
        const ageLeaderboard = leaderboard.filter(l => l.age_group === ageGroup);
        for (let i = 0; i < ageLeaderboard.length; i++) {
          if (ageLeaderboard[i].user_id === currentUser.id) { 
            agePlace = (i + 1).toString(); 
            break; 
          }
        }
      }
      
      return { absolute, gender: genderPlace, age: agePlace, ageGroupName };
    }
    
    async function loadWeeklyChart() {
      const today = new Date();
      const startOfWeek = new Date(today);
      startOfWeek.setDate(today.getDate() - today.getDay() + (today.getDay() === 0 ? -6 : 1));
      startOfWeek.setHours(0, 0, 0, 0);
      const startOfWeekStr = startOfWeek.toISOString().split('T')[0];
      
      const { data, error } = await sb
        .from('activities')
        .select('distance_km, activity_date')
        .eq('user_id', currentUser.id)
        .gte('activity_date', startOfWeekStr);
      
      if (error) return [];
      
      const days = [];
      for (let i = 0; i < 7; i++) {
        const date = new Date(startOfWeek);
        date.setDate(startOfWeek.getDate() + i);
        days.push({
          name: ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'][i],
          date: date.toISOString().split('T')[0],
          km: 0
        });
      }
      
      data.forEach(a => { 
        const day = days.find(d => d.date === a.activity_date); 
        if (day) day.km += a.distance_km || 0; 
      });
      
      return days;
    }
    
    async function loadLeaderboard(limit = 100) {
      let query = sb.from('leaderboard').select('*');
      
      if (leaderboardFilterGender !== 'all') {
        query = query.eq('gender', leaderboardFilterGender);
      }
      if (leaderboardFilterAge !== 'all') {
        query = query.eq('age_group', leaderboardFilterAge);
      }
      
      const { data, error } = await query
        .order(leaderboardSort, { ascending: leaderboardOrder === 'asc' })
        .limit(limit);
      
      if (error) return [];
      return data || [];
    }
    
    function changeLeaderboardSort(field) {
      if (leaderboardSort === field) {
        leaderboardOrder = leaderboardOrder === 'desc' ? 'asc' : 'desc';

        leaderboardSort = field;
        leaderboardOrder = 'desc';

    async function saveSettings() {
      const firstName = document.getElementById('settings-name')?.value || '';
      const lastName = document.getElementById('settings-lastname')?.value || '';
      const gender = document.getElementById('settings-gender')?.value || '';
      const birthDate = document.getElementById('settings-birthdate')?.value || '';
      const city = document.getElementById('settings-city')?.value || '';
      const stravaUsername = document.getElementById('settings-strava-username')?.value || '';
      const errorDiv = document.getElementById('settings-error');
      
      if (!errorDiv) return;
      
      errorDiv.innerHTML = '<span class="loader"></span> Сохранение...';
      
      const { error } = await sb
        .from('profiles')
        .update({
          first_name: firstName,
          last_name: lastName,
          name_full: `${firstName} ${lastName}`.trim(),
          gender: gender,
          birth_date: birthDate,
          city: city,
          strava_username: stravaUsername || null,
          updated_at: new Date().toISOString()
        })
        .eq('id', currentUser.id);
      
      if (error) {
        errorDiv.innerHTML = '❌ ' + error.message;
        errorDiv.style.color = '#ff6b6b';
      } else {
        errorDiv.innerHTML = '✅ Настройки сохранены';
        errorDiv.style.color = '#ffd966';
        showToast('Профиль обновлен!', 2000);
        setTimeout(() => { 
          if (errorDiv) errorDiv.innerHTML = ''; 
        }, 3000);
      }
    }

async function setupWebhook() {
  const statusDiv = document.getElementById('webhook-setup-status');
  const setupBtn = document.getElementById('setup-webhook-btn');
  
  if (setupBtn) {
    setupBtn.disabled = true;
    setupBtn.innerHTML = '<span class="loader"></span> Настройка...';
  }
  
  if (statusDiv) {
    statusDiv.innerHTML = '<div class="loader"></div> Настройка Webhook...';
  }
  
  try {
    const response = await fetch(`${SUPABASE_URL}/functions/v1/parse-activity/webhook/subscribe`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' }
    });
    
    const result = await response.json();
    
    if (result.success) {
      statusDiv.innerHTML = `
        <div style="color: #ffd966;">
          ✅ Webhook успешно настроен!<br>
          Новые тренировки будут приходить автоматически.<br>
          ID подписки: ${result.data?.id || '—'}
        </div>
      `;
      showToast('Webhook настроен! Новые тренировки будут приходить автоматически', 5000);
      
      // Перезагружаем страницу через 2 секунды, чтобы обновить статус
      setTimeout(() => {
        renderSyncPage();
      }, 2000);
    } else {
      throw new Error(result.error || 'Неизвестная ошибка');
    }
  } catch (error) {
    console.error('Error setting up webhook:', error);
    if (statusDiv) {
      statusDiv.innerHTML = `<div style="color: #ff6b6b;">❌ Ошибка: ${error.message}</div>`;
    }
    showToast(`Ошибка настройки Webhook: ${error.message}`, 5000);
  } finally {
    if (setupBtn) {
      setupBtn.disabled = false;
      setupBtn.innerHTML = '🔌 Настроить Webhook';
    }
  }
}

async function deleteWebhook() {
  if (!confirm('Вы уверены, что хотите отключить Webhook? Новые тренировки перестанут приходить автоматически.')) {
    return;
  }
  
  const deleteBtn = document.getElementById('delete-webhook-btn');
  const statusBlock = document.getElementById('webhook-status-block');
  
  if (deleteBtn) {
    deleteBtn.disabled = true;
    deleteBtn.innerHTML = '<span class="loader"></span> Отключение...';
  }
  
  try {
    // Сначала получаем ID подписки
    const statusResponse = await fetch(`${SUPABASE_URL}/functions/v1/parse-activity/webhook/status`, {
      method: 'GET',
      headers: { 'Content-Type': 'application/json' }
    });
    const status = await statusResponse.json();
    
    if (status.subscriptions && status.subscriptions.length > 0) {
      const subscriptionId = status.subscriptions[0].id;
      
      const response = await fetch(`${SUPABASE_URL}/functions/v1/parse-activity/webhook/delete?id=${subscriptionId}`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' }
      });
      
      const result = await response.json();
      
      if (result.success) {
        showToast('Webhook отключен', 3000);
        // Перезагружаем страницу
        setTimeout(() => {
          renderSyncPage();
        }, 1000);
      } else {
        throw new Error(result.error || 'Неизвестная ошибка');
      }
    } else {
      throw new Error('Нет активных подписок');
    }
  } catch (error) {
    console.error('Error deleting webhook:', error);
    showToast(`Ошибка отключения Webhook: ${error.message}`, 5000);
    if (statusBlock) {
      statusBlock.innerHTML = `<div style="color: #ff6b6b;">❌ Ошибка: ${error.message}</div>`;
    }
  } finally {
    if (deleteBtn) {
      deleteBtn.disabled = false;
      deleteBtn.innerHTML = '🗑 Отключить Webhook';
    }
  }
}

async function syncClubActivities(customDate = null) {
  const syncCustomBtn = document.getElementById('sync-custom-btn');
  const statusDiv = document.getElementById('sync-status');
  
  if (!statusDiv) return;
  
  if (syncCustomBtn) syncCustomBtn.disabled = true;
  
  statusDiv.innerHTML = '<div class="loader"></div> Синхронизация истории...';
  
  try {
    const requestBody = customDate ? { fromDate: customDate } : {};
    
    const response = await fetch(`${SUPABASE_URL}/functions/v1/parse-activity/club/sync`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(requestBody)
    });
    
    const result = await response.json();
    
    if (result.success) {
      statusDiv.innerHTML = `<div style="color: #ffd966;">✅ ${result.message || `Синхронизировано ${result.saved} тренировок`}</div>`;
      showToast(result.message || `Синхронизировано ${result.saved} тренировок`, 4000);
    } else {
      throw new Error(result.error || 'Неизвестная ошибка');
    }
  } catch (error) {
    console.error('Sync error:', error);
    statusDiv.innerHTML = `<div style="color: #ff6b6b;">❌ ${error.message || 'Ошибка соединения'}</div>`;
    showToast(`Ошибка синхронизации: ${error.message}`, 5000);
  } finally {
    if (syncCustomBtn) syncCustomBtn.disabled = false;
    setTimeout(() => {
      if (statusDiv && statusDiv.innerHTML && !statusDiv.innerHTML.includes('✅')) {
        statusDiv.innerHTML = '';
      }
    }, 5000);
  }
}

async function checkRateLimit() {
  const checkBtn = document.getElementById('check-rate-limit-btn');
  const rateLimitDiv = document.getElementById('rate-limit-info');
  
  if (checkBtn) {
    checkBtn.disabled = true;
    checkBtn.innerHTML = '<span class="loader"></span> Проверка...';
  }
  
  if (rateLimitDiv) {
    rateLimitDiv.style.display = 'block';
    rateLimitDiv.innerHTML = '<div class="loader"></div> Получение информации о лимитах...';
  }
  
  try {
    const response = await fetch(`${SUPABASE_URL}/functions/v1/parse-activity/rate-limit`, {
      method: 'GET',
      headers: { 'Content-Type': 'application/json' }
    });
    
    const data = await response.json();
    
    if (data.success) {
      const percent = data.usagePercent;
      let color = '#ffd966';
      
      if (data.status === 'warning') {
        color = '#e67e22';
      } else if (data.status === 'limited') {
        color = '#e74c3c';
      }
      
      rateLimitDiv.innerHTML = `
        <div style="background: rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 16px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <span style="font-weight: 600; color: white;">📊 Лимиты Strava API</span>
            <span style="color: ${color}; font-weight: 700;">${data.remaining} / ${data.limit}</span>
          </div>
          <div style="background: rgba(255,255,255,0.2); border-radius: 10px; height: 8px; overflow: hidden; margin-bottom: 12px;">
            <div style="background: ${color}; width: ${percent}%; height: 100%; border-radius: 10px;"></div>
          </div>
          <div style="font-size: 13px; color: rgba(255,255,255,0.7);">
            📈 Использовано: ${data.used} запросов (${percent}%)<br>
            ⏱ Сброс через: ${data.resetTimeRelative}
          </div>
          <div style="font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 8px;">
            ${data.statusMessage}
          </div>
        </div>
      `;
    } else {
      throw new Error(data.error || 'Не удалось получить информацию');
    }
  } catch (error) {
    console.error('Error checking rate limit:', error);
    if (rateLimitDiv) {
      rateLimitDiv.innerHTML = `
        <div style="background: rgba(231, 76, 60, 0.1); border-radius: 20px; padding: 16px;">
          <div style="color: #ff6b6b;">❌ Ошибка: ${error.message}</div>
        </div>
      `;
    }
  } finally {
    if (checkBtn) {
      checkBtn.disabled = false;
      checkBtn.innerHTML = '📊 Проверить лимиты';
    }
  }
}

        await renderSyncPage();
      } else if (currentPage === 'userProfile') {
        await renderUserProfile();
      } else {
        await renderHome();
      }
    }
    
    // Делаем функции глобальными
    window.register = register;
    window.login = login;
    window.logout = logout;
    window.syncClubActivities = syncClubActivities;
    window.resetSyncDate = resetSyncDate;
    window.navigateTo = navigateTo;
    window.openMenu = openMenu;
    window.closeMenu = closeMenu;
    window.saveSettings = saveSettings;
    window.changeLeaderboardSort = changeLeaderboardSort;
    window.checkRateLimit = checkRateLimit;
    window.leaderboardFilterGender = leaderboardFilterGender;
    window.leaderboardFilterAge = leaderboardFilterAge;
    
    // Запуск
    initSession();
    window.addEventListener('popstate', () => handleRouting());
  </script>
</body>
</html>
